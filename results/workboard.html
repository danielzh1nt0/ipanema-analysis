<title>Ipanema Work Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scoreboard header, then two tabs - Progress (bars toward the 90% goal) and Tasks (kanban from the work queue) */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --ink: #17211c; --muted: #5d6b63; --line: #d9e0db;
  --turf: #1f7a4d; --turf-soft: #e1f0e7; --warn: #b7791f; --warn-soft: #fbf0dc; --bad: #b3413a; --bad-soft: #f8e3e1;
  --you: #2c5aa0; --you-soft: #e3ebf7;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111714; --panel: #18201c; --ink: #e6ece8; --muted: #9aa9a1; --line: #2a352f;
  --turf: #4fbf86; --turf-soft: #1c3328; --warn: #e0a84a; --warn-soft: #33291a; --bad: #e27a72; --bad-soft: #3a2220;
  --you: #7ea6e8; --you-soft: #1d2a40; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111714; --panel: #18201c; --ink: #e6ece8; --muted: #9aa9a1; --line: #2a352f;
  --turf: #4fbf86; --turf-soft: #1c3328; --warn: #e0a84a; --warn-soft: #33291a; --bad: #e27a72; --bad-soft: #3a2220;
  --you: #7ea6e8; --you-soft: #1d2a40; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.4rem; letter-spacing: .01em; margin: 0; line-height: 1; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.sub a { color: var(--turf); }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
nav button { font: 600 .95rem var(--body); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--turf); }
nav button:focus-visible, summary:focus-visible, .more:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
.label { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
/* progress */
.pillars { display: grid; gap: 10px; }
.pillar { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; grid-template-columns: minmax(150px, 220px) 1fr 64px; gap: 6px 18px; align-items: center; }
.pillar h3 { font: 700 1.25rem var(--display); margin: 0; letter-spacing: .01em; }
.pillar .note { grid-column: 1 / -1; color: var(--muted); font-size: .88rem; min-width: 0; }
.bar { position: relative; height: 14px; background: var(--line); border-radius: 3px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.bar .goal { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.bar .goal::after { content: "90% goal"; position: absolute; top: -17px; left: -22px; font: 500 .66rem var(--mono); color: var(--muted); white-space: nowrap; }
.num { font: 700 1.6rem var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.ok { --c: var(--turf); } .warn { --c: var(--warn); } .bad { --c: var(--bad); }
.fill { background: var(--c); } .num { color: var(--c); }
.measured { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td:last-child { font-family: var(--mono); font-size: .84rem; font-variant-numeric: tabular-nums; }
/* kanban */
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 .78rem var(--mono); padding: 3px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.col > h2 { font: 700 1.1rem var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0; display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 3px solid var(--c, var(--line)); }
.col > h2 span { font-family: var(--mono); font-size: .8rem; color: var(--muted); font-weight: 500; }
.c-you { --c: var(--you); } .c-next { --c: var(--turf); } .c-queue { --c: var(--muted); } .c-blocked { --c: var(--warn); } .c-done { --c: var(--turf); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.c-you .card { background: var(--you-soft); border-color: transparent; }
.c-done .card { opacity: .85; }
.card .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tag { font: 500 .68rem var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--turf-soft); color: var(--turf); }
.tag.Ball { background: var(--warn-soft); color: var(--warn); } .tag.Players { background: var(--you-soft); color: var(--you); }
.tag.Stats { background: var(--turf-soft); color: var(--turf); } .tag.Setup { background: var(--line); color: var(--muted); }
.id { font: 500 .72rem var(--mono); color: var(--muted); }
.card .t { font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
details { font-size: .82rem; color: var(--muted); }
summary { cursor: pointer; font-size: .78rem; }
details p { margin: 6px 0 0; overflow-wrap: anywhere; }
.more { font: 500 .8rem var(--body); color: var(--turf); background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 6px; cursor: pointer; }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .board { grid-template-columns: minmax(0, 1fr); } .pillar { grid-template-columns: 1fr 56px; } .pillar .bar { grid-column: 1 / -1; grid-row: 2; } h1 { font-size: 2rem; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .6s ease; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">Sollentuna FK · Veo follow-cam analysis</div>
      <h1>Ipanema Work Board</h1>
    </div>
    <div class="sub" id="updated"></div>
  </header>
  <nav role="tablist">
    <button role="tab" id="tab-progress" aria-selected="true" data-tab="progress">Progress</button>
    <button role="tab" id="tab-tasks" aria-selected="false" data-tab="tasks">Tasks</button>
  </nav>
  <section id="progress" role="tabpanel" aria-labelledby="tab-progress" style="display:grid;gap:20px">
    <div class="pillars" id="pillars"></div>
    <div class="label">Measured numbers</div>
    <div class="measured"><table id="measured"></table></div>
  </section>
  <section id="tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden style="display:grid;gap:14px">
    <div class="summary" id="summary"></div>
    <div class="board" id="board"></div>
  </section>
</div>

<script>
const DATA = {"updated": "29 Sep 2026, 21:02", "release_board": "https://claude.ai/artifact/P3HvybgjWGxXeUuFZTgvW6", "progress": {"goal": 90, "pillars": [{"label": "Pitch lines", "value": 87, "status": "warn", "note": "SFK-BP test clip: share of time with a trusted camera. Other grounds not calibrated yet."}, {"label": "Players found", "value": 88, "status": "warn", "note": "New pipeline: 0-1 players missed per frame on SFK-BP (was 2-4). Night fixes 29 Sep: off-pitch people dropped, whites no longer read as green (239/252 right at Reymersholm). Not in the app yet."}, {"label": "Who has the ball", "value": 83, "status": "warn", "note": "New rule: 82/99 on SFK-BP and 27/32 on Reymersholm (night, no calibration). Old method: 43/99. Now the default in the pipeline (29 Sep); reaches the app at the next paid run."}, {"label": "Ball dot", "value": 65, "status": "bad", "note": "22 of 34 checked moments in the app. The finders see the ball; picking the right guess is the problem."}, {"label": "Set pieces", "value": 60, "status": "warn", "note": "Estimate only: 10 found on the clip, Veo lists 6. Not checked to the second."}, {"label": "Full match in the app", "value": 0, "status": "bad", "note": "Only the 5-minute test clip runs on the new pipeline so far."}], "measured": [["Players tracked (median, SFK-BP clip)", "dark 1.5 -> 4.1 s, light 0.7 -> 7.0 s"], ["Who has the ball, 99 graded moments", "current 43 -> new rule 82"], ["Who has the ball, Reymersholm (night)", "27 of 32 with the new rule"], ["Ball: finder has a guess on the ball", "31 of 34 moments (WASB), 79 of 81 exam frames"], ["Ball: right guess picked", "22-23 of 34"], ["Passes on pro data (Metrica)", "3-15% off per half"], ["Lost balls on pro data", "20% found with the current rule, 37% with 1 s limits"]]}, "tasks": [{"id": "E5", "area": "Stats", "title": "Count possession sequences properly on the new rule", "detail": "E5 (29 Sep: sequences now ignore short takeovers (other team must out-hold by 0.5 s) and join a team's play across loose gaps up to 3 s: SFK-BP 210 -> 86, Reymersholm 205 -> 81 (old model 64/80); who-has-the-ball keys unchanged (82/99, 27/32); Metrica clean 567 vs 694 real, 72% of ours real (E4 rule 34%). Nightly Metrica check now uses the pipeline state + a sequences row (dry run: passes 15% off, possession 8 pts). results/possession/e5_2026-09-29.md). Was: Sequences on the new possession state: it flips between the teams ~190 times per 5 min, so sequences went 64 -> 210 (median 0.6 s). Fix in P.sequences (join short flips / minimum length), not in the state (deflicking the state cost key moments: Reymersholm 27 -> 22-24/32). Grade: sequence count + who-has-the-ball keys unchanged. Then switch the nightly Metrica check (tools/metricalab.py) to P.pipeline_state, with a note in the scorecard.", "col": "done"}, {"id": "E4", "area": "Stats", "title": "Switch the app to the new who-has-the-ball rule", "detail": "E4 (29 Sep: possession_simple is the pipeline default (IPANEMA_POSSESSION=viterbi = old model); who-has-the-ball SFK-BP 43 -> 82/99, Reymersholm 23 -> 27/32; lost balls 3 -> 19 and 0 -> 18 per 5 min (1 s rule); passes and restarts unchanged; sequences got worse (64 -> 210, the state flips between teams) -> E5. results/possession/e4_2026-09-29.md). Was: make possession_simple the pipeline default (run.py: possession state -> passes, turnovers, possession %), keep the old model behind an env switch; recompute stats on SFK-BP + Reymersholm offline and compare with the old numbers; the app picks it up at the next paid run (A1).", "col": "done"}, {"id": "P8", "area": "Players", "title": "Fix white players read as the green team at night", "detail": "P8 (29 Sep: new per-player team classifier (body colour histogram, trained per match, no labels): Reymersholm night 239/252 players right vs 195, whites read green 51 -> 7/115; Spånga (new 279-player key) and SFK unchanged - it switches itself off unless it makes the team split nearer 50/50. On by default. P7's on/off check: no difference in that 20 s. 20-s tracking check with/without it started on the free runner -> results/qa/p8_track_on/off. results/qa/p8/README.md). Was: whites read as the green team at night: really 51/115 of Reymersholm's on-pitch whites (252 players labelled by eye, results/qa/p7/README.md), not 7/31. Colour tweaks don't fix it (blurred shirts sit between the kits). Try a small per-player team classifier (crops; trained per match from confident players, graded on the 252 labels), must keep SFK/Spånga right. First read the free-runner result results/qa/p7_track_on vs p7_track_off (Reymersholm 20 s, off-pitch drop on/off). Then E3.", "col": "done"}, {"id": "P7", "area": "Players", "title": "Night games: ignore people standing off the pitch", "detail": "P7 (29 Sep: new pitch-edge test finds people off the pitch without calibration - Reymersholm 109/414 dropped, by eye ~7 players wrongly and 3 non-players kept; the old grass test dropped 321, most of them real players under floodlights. On in tracktest for uncalibrated grounds; dry run dark 11 -> 8 per frame. Whites-as-green NOT fixed -> P8. results/qa/p7/README.md). Was: uncalibrated grounds - drop tracked people whose feet are off the grass (kits.on_grass) before counting/possession; then reduce whites read as green at night (7/31). Test on results/qa/kitprobe frames, re-run kaggle/track_reym.py (free), grade E3 on results/qa/who_reym strips.", "col": "done"}, {"id": "P6", "area": "Players", "title": "Night games: find why whites turn green during tracking", "detail": "P6 (29 Sep: vote fine; 12-frame kit learning unstable -> 36; main cause = off-pitch people tracked as the dark team on uncalibrated grounds; P7). Was: Reymersholm tracked video shows whites as green although single-frame colour is 87% right. Find where: per-track team vote vs identity swaps. Needs per-frame colour readings saved in the tracking rows (add to tracktest SAVE_ALL_ROWS), re-run on Kaggle (free), compare frame reading vs track label on the who_reym2 moments. Fix, then grade E3.", "col": "done"}, {"id": "P5", "area": "Players", "title": "Night games: white players read as the green team", "detail": "P5 (29 Sep: single-frame colour reading is 62/71 right at night; lightness/grass tweaks don't help; the fault is later - P6). Was: white players read as the green team at night on Reymersholm (results/review/who_reym_2026-09-28.md). Fix offline on results/qa/kitprobe/<ground>/ frames+boxes (label a few players by eye first), keep SFK and Spånga right; then re-run kaggle/track_reym.py (free: triggers/kaggle.txt) and grade E3.", "col": "done"}, {"id": "P4", "area": "Players", "title": "Fix team colours at night (spectators counted as a team)", "detail": "P4 (28 Sep: pitch_only = learn kits only from people whose feet are on grass; by eye cleaner on Reymersholm, Spånga and SFK (results/qa/kitprobe); now the default. green_kit had no effect, off.) Was: team split fails on Reymersholm night piece (results/review/who_reym_2026-09-28.md): spectators become a team, green+white merge. Fix without calibration: drop people who stay near the frame's top edge / hardly move (bench, spectators); more sample frames; check grass removal at night vs green kits. Test on the free runner (RF-DETR CPU on 24 frames) for Reymersholm, Spånga, SFK; must not break SFK. Then re-run E3 (needs one more GPU tracking run, ~$0.15, ask Daniel).", "col": "done"}, {"id": "E3", "area": "Stats", "title": "Check the new who-has-the-ball rule on a second ground (Reymersholm)", "detail": "E3 (29 Sep: Reymersholm 27/32 with possession_simple, SFK 82/99 -> holds on 2 grounds). Was: possession_simple (51/61 vs 27/61 on SFK-BP) needs a second ground before it becomes the default: who-has-the-ball strips + answers on Reymersholm or Vasalund. Needs ball picks there (GPU: Kaggle once the token works, or a small Modal run with Daniel's go). Then: passes/turnovers/possession computed from possession_simple, graded on the same keys.", "col": "done"}, {"id": "E2", "area": "Stats", "title": "Fix possession: measure ball-to-player distance in the picture", "detail": "E2 (28 Sep: key grown to 99 clear moments, 38 of them fresh and blind; possession_simple 31/38 on the fresh ones and 82/99 overall vs 43/99 for the current model; it has neither the dead-ball nor the missing-carrier fault; default waits for E3's second ground. results/review/who_2026-09-28.md) Possession on our footage is right in only 9/24 clear moments (results/review/who_2026-09-28.md). Fix, graded on who_answers.json: (a) dead-ball wrongly called during play (5/24): don't trust off-pitch projections of single ball picks; (b) carrier not found for a player on the ball (7/24): link in pixels (ball near feet) not only metres. Grow the key to 100+ moments (more strips, Reymersholm/Spånga) first so fixes aren't tuned to 24.", "col": "done"}, {"id": "K1", "area": "Setup", "title": "Use Kaggle's free GPU for tracking and ball pictures", "detail": "K1 (29 Sep: Kaggle + free runner, $0: only 65 checked balls on the 4 matches are in the repo (full label sets are on Modal only) and the pretrained WASB misses 47/65 of them; following each ball +-12 frames gave 473 new ball pictures (results/free/k1b, results/kaggle/ballcrops_k1). No scorer gain -> T0. results/ball/scorer/k1.md). Was: Kaggle free GPU (about 30 h/week): a notebook pushed by the Kaggle API from the free runner that reads matches from R2, runs WASB (30 peaks) + the click finder, and cuts ball/not-ball crops at the checked labels of Vasalund, Solheim, Spånga, Djursholm (thousands of balls). Then retrain the scorer (T0) and grade on exam + clip. No Modal.", "col": "done"}, {"id": "K2", "area": "Setup", "title": "Move training runs to Kaggle so they cost nothing", "detail": "K2 (29 Sep, ticked by the worker from the committed results: RF-DETR ball finder trained on Kaggle, $0, 127 min on a T4 from ~5,000 ball pictures of 4 matches + SFK-BP clicks; exam 84/108 vs 70 for the old finder; now in the app. results/kaggle/ballfinder_rfdetr). Was: Same Kaggle route for training runs (ball finder on RF-DETR, B7) so training stops costing money.", "col": "done"}, {"id": "H1", "area": "Ball", "title": "Try a free public set of ball pictures (Hugging Face)", "detail": "H1 (29 Sep: looked at it on the free runner: 1,237 Bundesliga TV pictures, 48/48 labels right by eye, ball Veo-sized (median 12 px) but all pro stadiums and easy ground balls, frames from ~14+ short clips; the clips look like the Kaggle DFL competition videos, so the CC BY 4.0 label is doubtful. Exam test needs one Kaggle training run -> Waiting for Daniel. results/ball/h1_hfball.md). Was: Check martinjolif/football-ball-detection (HF, CC BY 4.0, 1,237 images) as extra ball pictures: look at a sample sheet, see if it is broadcast-only; use only if it helps the exam.", "col": "done"}, {"id": "T0", "area": "Ball", "title": "Teach a small model to tell the ball from lines, shoes and cones", "detail": "T0 (29 Sep: retrained with 733 ball pictures (SFK-BP 260 + 473 from 4 matches): exam 65-66/81 vs 61 baseline, clip 22-23/34 vs 25 -> no gain, not promoted; the other grounds made the scorer alone worse. Fair test needs the full checked label sets from Modal or the fine-tuned WASB. results/ball/scorer/k1.md). Was: TOP: second-opinion scorer on WASB guesses. WASB sees the ball in 31/34 clip moments and 79/81 exam frames but ranks it first only 26 and 56 times (results/ball/probe.md). Train a small crop classifier (ball vs not) on CPU: positives = Daniel's 436 clicks, negatives = WASB's other peaks in the same frames (probe.json has the guesses for 142 frames; more from the WASB cache). Re-rank, then picker. Grade: exam 81 + clip 34, cross-validated by frame. Also: stop capping WASB at 6 peaks (keep ~30, local maxima) - needs a WASB re-run on the clip (GPU ~5 min, ask Daniel).", "col": "done"}, {"id": "B1b", "area": "Ball", "title": "Re-test 'ball with this player' using both ball finders", "detail": "B1b. Re-run B1 and the miss count on FUSED guesses (both finders), not WASB-only: picklab only had WASB guesses locally. Needs the click-finder guess cache for the clip (see Waiting for Daniel).", "col": "done"}, {"id": "B8", "area": "Ball", "title": "Find out why the app scores 22/34 on the ball", "detail": "B8. Why the app clip scored 22/34 when the offline fused test scored 25-26/34: compare finder version, stride, far-zoom, cache.", "col": "done"}, {"id": "B2", "area": "Ball", "title": "Check whether the ball finders see missed balls weakly", "detail": "B2. Look below the cut-off: at the 8 moments with no guess on the ball, do the finders see the ball weakly? Needs raw heatmaps (only on Modal) -> write what is needed under \"Waiting for Daniel\".", "col": "done"}, {"id": "P1", "area": "Players", "title": "Striped kits at night (Spånga): players missed", "detail": "P1. Spånga striped kits (P8 found: 79 of 279 Spånga players read as 'neither team', mostly striped ones; key in results/qa/kitprobe/spanga_labels_p8.json): check the re-run (results/qa/tracktest_p15u-vs-spanga-2026-09-25) after the track-vote change; if players are still missing, find out why and fix, re-test on all grounds.", "col": "next"}, {"id": "B3", "area": "Ball", "title": "Ball labels from the free SoccerTrack data", "detail": "B3. (LOW, after S3; round 8 collapsed on SoccerTrack and Gemini agrees the fisheye view is too different) Prepare SoccerTrack v2 ball labels in pixels (repo script scripts/calibration/project_tracking_to_image.py, ground balls only, check the known y-flip problems). Free runner, HF_TOKEN secret. Output: crops + labels ready for training, plus a picture sheet to check projection.", "col": "next"}, {"id": "B4", "area": "Ball", "title": "Grow the ball answer key to 300+ moments without clicking", "detail": "B4. Grow the ball answer key from 34 to 300+ moments without Daniel clicking: frames where both finders AND the picker agree with high confidence, plus a check sheet Claude grades by eye.", "col": "next"}, {"id": "E1", "area": "Stats", "title": "Answer key: who has the ball, on our own footage", "detail": "E1 (28 Sep: 99-moment who-has-the-ball key on SFK-BP, graded by eye). Was: Main ball score = \"who has the ball\" (team, per stretch of play) on our own footage, not only \"within 30 px\". Start from the 40 who-has-the-ball moments already in results/review/stats_SFKBP1109_s1200 + B4 moments. Report it in the nightly scorecard. (Gemini review 28 Sep, agreed)", "col": "done"}, {"id": "T1", "area": "Ball", "title": "Second check on every ball guess before picking", "detail": "T1. Second-opinion check on each ball guess: a small 3-frame crop classifier (ball moving vs line/shoe/cone) that removes false guesses before the picker. Train on CPU from existing clicks + guesses; grade on the 34 moments + exam. (Gemini review)", "col": "queue"}, {"id": "S3", "area": "Ball", "title": "Make extra training pictures by pasting real balls onto grass", "detail": "S3. Pasted balls: cut real ball crops from Daniel's clicks and paste them (blurred, 4-8 px) onto our own grass frames, far side especially, as extra training pictures. Picture sheet to check before any training. (Gemini suggested white circles; real crops are better)", "col": "queue"}, {"id": "Z1", "area": "Ball", "title": "Handle the ball in the air", "detail": "Z1. Picker: \"ball in the air\" flag, so a ball off the pitch plane isn't punished by pitch-metre rules; grade on the 34 moments.", "col": "queue"}, {"id": "PF1", "area": "Ball", "title": "Try a different ball picker (particle filter)", "detail": "PF1. Particle filter picker (ground / air / with player) vs the current Viterbi, same 34 moments + exam. Only replaces Viterbi if it scores better.", "col": "queue"}, {"id": "PC1", "area": "Stats", "title": "Stats from player movement only, as a cross-check", "detail": "PC1. Passes/possession from player movement only (PathCRF, MPL-2.0) on the free Metrica data; compare with our ball-based stats.", "col": "queue"}, {"id": "B5", "area": "Ball", "title": "Sort the missed balls by cause", "detail": "B5 (28 Sep: 8/13 at feet or crowd, 4/13 in the air, 1 open; results/picker/misses.md). Why the finders miss: for each of the 13 missed moments on SFK-BP, crop the frame and sort into: ball in the air / at feet / in a crowd / far away / blurred / off-pitch confusion. Picture sheet + counts in results/picker/misses.md. Decides where training labels must come from.", "col": "done"}, {"id": "B6", "area": "Ball", "title": "Ball answer key on a second ground", "detail": "B6. Second ball answer key on another ground (Vasalund or Reymersholm): 30+ moments from Daniel's earlier clicks (results/review/*) so ball numbers are not judged on one clip only. No new clicking.", "col": "queue"}, {"id": "B7", "area": "Ball", "title": "New ball finder with a commercial-friendly licence", "detail": "B7 (29 Sep, done with K2: script kaggle/ballfinder_rfdetr.py, CPU dry run + Kaggle smoke run, then the real run: exam 84/108 vs 70). Was: Ball finder on RF-DETR (Apache): write the training script + dataset format (from click labels + B3), dry-run 1 epoch on CPU with 50 images. Real training waits for Daniel's go.", "col": "done"}, {"id": "P2", "area": "Players", "title": "Players checked on all 6 training matches", "detail": "P2. Players on all 6 training matches with the free runner (20 s each, 3 spots per match): table of tracked seconds, missed players, referee counted, per ground. Fix the worst ground.", "col": "queue"}, {"id": "P3", "area": "Players", "title": "Join broken player tracks", "detail": "P3. Tracklet joining (gta-link idea, MIT): join broken pieces of the same player; measure pieces per 20 s and time tracked on SFK, Spånga, Reymersholm.", "col": "queue"}, {"id": "S1", "area": "Stats", "title": "Pass count: find and fix what we miss or add", "detail": "S1 (29 Sep: misses were passes broken by the ball running past an opponent; new default rule finds 73% of real passes (was 61%), 73% of ours real (was 65%), count off at most 8.6% on 4 halves clean+noisy (was 13%), 7 of 8 within 7.4%; possession/lost balls unchanged; possession_simple better state than the old model but passes stay on ball contacts; E4 note: lost balls need 1 s limits with possession_simple. results/metrica/passes_2026-09-29.md). Was: Stats on pro data: passes still 12-17% off. Find which passes we miss/add (Metrica), fix the rule, keep possession within 7 pts.", "col": "done"}, {"id": "S2", "area": "Stats", "title": "Set pieces from player movement", "detail": "S2. Set pieces from motion (stoppages_from_motion): score on Metrica, target 80% found with few extras.", "col": "queue"}, {"id": "A1", "area": "Setup", "title": "Prepare the one paid run that puts the new version in the app", "detail": "A1. Prepare the \"one paid run\" list: exactly what goes to the app (new players + current ball) on which clips, estimated cost, command ready. Put it under Waiting for Daniel.", "col": "queue"}, {"id": "N1", "area": "Setup", "title": "Every morning: react to the nightly scorecard", "detail": "N1. Every morning: read results/nightly/<date>.md, and if anything got worse than the day before, put it at the top of this queue.", "col": "queue"}, {"id": null, "area": null, "title": "H1: the outside ball set (1,237 Bundesliga TV pictures) seems to be frames of the Kaggle DFL competition videos, so its CC BY 4.0 ", "detail": "H1: the outside ball set (1,237 Bundesliga TV pictures) seems to be frames of the Kaggle DFL competition videos, so its CC BY 4.0 label is doubtful. OK to (a) test it in one free Kaggle training run (current set + these, graded on exam + clip), and (b) keep it only for testing unless the licence is cleared? My guess: small gain at most (easy TV balls, not our hard cases). results/ball/h1_hfball.md", "col": "you"}, {"id": null, "area": null, "title": "K1/T0: the full checked ball label sets (Vasalund, Solheim, Spånga, Djursholm: thousands per match) and the fine-tuned WASB are on", "detail": "K1/T0: the full checked ball label sets (Vasalund, Solheim, Spånga, Djursholm: thousands per match) and the fine-tuned WASB are only on the Modal volume. Copying those files out (a download, no GPU) needs your OK to touch Modal; then the scorer can get a fair test on Kaggle for free.", "col": "you"}, {"id": "B6", "area": "Ball", "title": "B6-lite new ball finder on unseen grounds (Daniel's old yes/no checks, free Kaggle)", "detail": "B6-lite new ball finder on unseen grounds (Daniel's old yes/no checks, free Kaggle): Reymersholm night 21/23, Solberga 6/7 top guess on the ball; fooled 0/13 by not-a-ball. Leans easy (moments came from old finder). results/ball/grounds_2026-09-29.md", "col": "done"}, {"id": "T4", "area": "Ball", "title": "Kaggle works (free Tesla T4, internet)", "detail": "Kaggle works (free Tesla T4, internet): tools/kaggle_run.py + triggers/kaggle.txt; Reymersholm tracking in 21 min, $0.", "col": "done"}, {"id": "S1b", "area": "Stats", "title": "S1b turnovers/possession on Metrica", "detail": "S1b turnovers/possession on Metrica: 3 s rule finds 20% of losses; frame-to-frame ball speed made the possession model say 'nobody has it' 76-87% of the time under noise; windowed speed fixes it on pro data but not proven on our clip (no answer key). Options added, defaults unchanged. results/metrica/turnovers_2026-09-28.md", "col": "done"}, {"id": "B1", "area": "Ball", "title": "B1 \"ball with this player\" option in the picker.", "detail": "B1 \"ball with this player\" option in the picker. No gain: 21/34 at best (tools/posslab.py, results/picker/posslab.json). Of the 9 moments with no finder guess, a player's feet are on the ball in only 3, so the ball is mostly in the air / far / not near a detected player. Option kept, off by default. -> the finder is the limit; B5 and B7 next.", "col": "done"}, {"id": null, "area": "Players", "title": "new player pipeline (RF-DETR + per-match kits + gap filling + keeper + duplicates)", "detail": "new player pipeline (RF-DETR + per-match kits + gap filling + keeper + duplicates): full SFK-BP clip, dark players tracked 1.5 -> 4.1 s, light 0.7 -> 7.0 s.", "col": "done"}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function render(D) {
  $("#updated").innerHTML = `Updated ${esc(D.updated)} · <a href="${esc(D.release_board)}" target="_blank" rel="noopener">Release history</a>`;
  const goal = D.progress.goal;
  $("#pillars").innerHTML = D.progress.pillars.map(p => {
    const v = p.value == null ? 0 : p.value;
    return `<div class="pillar ${p.status}"><h3>${esc(p.label)}</h3>
      <div class="bar" role="img" aria-label="${esc(p.label)}: ${v}% of ${goal}% goal"><div class="fill" style="width:${v}%"></div><div class="goal" style="left:${goal}%"></div></div>
      <div class="num">${p.value == null ? "–" : v + "%"}</div><div class="note">${esc(p.note)}</div></div>`;
  }).join("");
  $("#measured").innerHTML = D.progress.measured.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");
  const cols = [["you", "Waiting for you"], ["next", "Up next"], ["queue", "Queue"], ["blocked", "Blocked"], ["done", "Done"]];
  const by = Object.fromEntries(cols.map(([k]) => [k, D.tasks.filter(t => t.col === k)]));
  $("#summary").innerHTML = cols.map(([k, n]) => `<span class="chip">${n}: ${by[k].length}</span>`).join("");
  const card = t => `<div class="card"><div class="top">${t.area ? `<span class="tag ${esc(t.area)}">${esc(t.area)}</span>` : ""}${t.id ? `<span class="id">${esc(t.id)}</span>` : ""}</div>
      <div class="t">${esc(t.title)}</div>${t.detail ? `<details><summary>Details</summary><p>${esc(t.detail)}</p></details>` : ""}</div>`;
  $("#board").innerHTML = cols.map(([k, n]) => {
    const list = by[k], limit = k === "done" ? 8 : 99, shown = list.slice(0, limit);
    return `<div class="col c-${k}" data-col="${k}"><h2>${n}<span>${list.length}</span></h2>${shown.map(card).join("")}
      ${list.length > limit ? `<button class="more" data-more="${k}">Show all ${list.length}</button>` : ""}</div>`;
  }).join("");
  document.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    const k = b.dataset.more; b.insertAdjacentHTML("beforebegin", by[k].slice(8).map(card).join("")); b.remove();
  });
}
function show(tab) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#progress").hidden = tab !== "progress"; $("#tasks").hidden = tab !== "tasks";
  try { localStorage.setItem("tab", tab); } catch (e) {}
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
render(DATA);
let start = location.hash.replace("#", "");
if (!["progress", "tasks"].includes(start)) { try { start = localStorage.getItem("tab") || "progress"; } catch (e) { start = "progress"; } }
show(start);
</script>

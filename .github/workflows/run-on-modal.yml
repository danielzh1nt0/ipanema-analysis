      - name: scoreboard
        if: always()
        run: |
          for f in $(git ls-files --others --modified results/modal | grep '\.txt$'); do m=$(basename "$f" .txt); python scripts_scoreboard.py "$f" "${{ github.sha }}" "$m" || true; done
      - name: release log (one entry per pipeline version)
        if: always()
        run: python scripts_release.py
      - name: commit results
        if: always()
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results && git commit -m "modal results" || echo "nothing to commit"
          git pull --rebase -X theirs origin main && git push origin HEAD:main
      - name: tell Daniel (opens an issue, which GitHub emails)
        if: always() && (contains(github.event.head_commit.message, '[run') || contains(github.event.head_commit.message, '[full:') || contains(github.event.head_commit.message, '[check:'))
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull -q origin main || true
          python scripts_notify.py && gh issue create --title "$(cat /tmp/issue_title)" --body-file /tmp/issue_body.md
      - name: on failure, save this job's log into the repo (results/ci/failure_<run>.txt) so it can be read without GitHub access
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="run") | .id')
          mkdir -p results/ci && (gh api "repos/${{ github.repository }}/actions/jobs/$JOB/logs" > results/ci/failure_${{ github.run_number }}.txt 2>&1 || echo "log fetch failed" > results/ci/failure_${{ github.run_number }}.txt)
          tail -c 200000 results/ci/failure_${{ github.run_number }}.txt > results/ci/tmp && mv results/ci/tmp results/ci/failure_${{ github.run_number }}.txt
          git config user.name ci-bot && git config user.email ci@ipanema && git pull -q --rebase origin main || true
          git add results/ci && git commit -qm "ci: failure log ${{ github.run_number }}" && git push

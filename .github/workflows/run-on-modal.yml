      - name: follow-cam tracking for ALL pieces of a match, one core each in parallel (commit tagged trackall:<match_id>)
        if: contains(github.event.head_commit.message, '[trackall:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[trackall:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          inv = modal.Function.from_name("ipanema", "piece_inventory").remote(mid)
          done = {r["i"] for r in inv.get("pieces", []) if r.get("tracked")}
          todo = [r["i"] for r in inv.get("pieces", []) if r["i"] not in done]
          print("pieces to track:", todo, "| already tracked:", sorted(done))
          fn = modal.Function.from_name("ipanema", "track_piece")
          d = f"results/check/{mid}_track"; os.makedirs(d, exist_ok=True); rows = []
          for out in fn.map(todo, kwargs={"match_id": mid}, order_outputs=False) if False else fn.starmap([(mid, i) for i in todo], order_outputs=False):
              for name, b64 in out.pop("images", {}).items(): open(f"{d}/{name}", "wb").write(base64.b64decode(b64))
              open(f"{d}/track_{out['piece']}.json", "w").write(json.dumps(out, indent=1)); rows.append(out)
              print(f"piece {out['piece']}: {out['good_pct']}% good, {out['restarts']} restarts, {out['seconds']} s")
          rows.sort(key=lambda r: r["piece"]); open(f"{d}/summary.md", "w").write("| piece | judged good | restarts | seconds |\n|---|---|---|---|\n" + "".join(f"| {r['piece']} | {r['good_pct']}% | {r['restarts']} | {r['seconds']} |\n" for r in rows))
          PY

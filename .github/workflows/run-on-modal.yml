name: run on modal
on:
  push:
    branches: [main]
    paths: ["ipanema/**", "modal_app.py", "calibration/**"]
  workflow_dispatch:
    inputs:
      match_id: { description: "match id", default: "SFKBP1109_s1200" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    environment: MODAL_TOKEN_ID
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal numpy
      - name: check the code compiles on the runner's Python (stops here before any spend)
        run: python -m py_compile modal_app.py scripts_scoreboard.py ipanema/*.py && python --version
      - name: deploy (always; costs nothing until something calls it)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py
      - name: run a match (only when the commit is tagged run)
        if: contains(github.event.head_commit.message, '[run') || github.event_name == 'workflow_dispatch'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MATCH: ${{ github.event.inputs.match_id || 'SFKBP1109_s1200' }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, json, base64, re
          hit = re.search(r"\[run:([A-Za-z0-9_-]+)\]", os.environ.get("MSG", ""))
          m = hit.group(1) if hit else os.environ["MATCH"]; f = modal.Function.from_name("ipanema", "run_match")
          out = f.remote(m, f"{os.environ['R2_PUBLIC_URL']}/{m}/video.mp4")
          os.makedirs("results/modal", exist_ok=True)
          open(f"results/modal/{m}.txt", "w").write("\n".join(out["log_tail"]) + "\n\nSUMMARY " + json.dumps(out["summary"], default=str))
          for name, b64 in out.get("files", {}).items(): open(f"results/modal/{m}_{name}", "wb").write(base64.b64decode(b64))
          print("\n".join(out["log_tail"][-25:]))
          PY
      - name: prepare a new match (commit tagged prepare:<match_id>)
        if: contains(github.event.head_commit.message, '[prepare:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, base64
          hit = re.search(r"\[prepare:([A-Za-z0-9_-]+)(?::(\d+))?\]", os.environ["MSG"]); mid = hit.group(1); start = int(hit.group(2) or 1200)
          out = modal.Function.from_name("ipanema", "prepare_match").remote(mid, f"{os.environ['R2_PUBLIC_URL']}/{mid}/video.mp4", start)
          mid = out.get("match_id", mid); d = f"results/prepare/{mid}"; os.makedirs(d, exist_ok=True)
          for name, b64 in out.items():
              if name.endswith(".jpg"): open(f"{d}/{name}", "wb").write(base64.b64decode(b64))
          open(f"{d}/segment.txt", "w").write(out.get("segment", ""))
          print("prepared", mid)
          PY
      - name: run a full match (commit tagged full:<match_id>)
        if: contains(github.event.head_commit.message, '[full:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[full:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "run_full").remote(mid, f"{os.environ['R2_PUBLIC_URL']}/{mid}/video.mp4")
          os.makedirs("results/modal", exist_ok=True)
          open(f"results/modal/{mid}_full.txt", "w").write("\n".join(out["log_tail"]) + "\n\nSUMMARY " + json.dumps(out["summary"], default=str))
          for name, b64 in out.get("files", {}).items(): open(f"results/modal/{mid}_full_{name}", "wb").write(base64.b64decode(b64))
          print("\n".join(out["log_tail"][-40:]))
          PY
      - name: scoreboard
        if: always()
        run: |
          for f in $(git ls-files --others --modified results/modal | grep '\.txt$'); do m=$(basename "$f" .txt); python scripts_scoreboard.py "$f" "${{ github.sha }}" "$m" || true; done
      - name: commit results
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results && git commit -m "modal results" || echo "nothing to commit"
          git pull --rebase -X theirs origin main && git push origin HEAD:main

name: run on modal
on:
  push:
    branches: [main]
    paths: ["ipanema/**", "modal_app.py", "calibration/**", "tests/**", "scripts_*.py", "periods/**", "triggers/**"]
  workflow_dispatch:
    inputs:
      match_id: { description: "match id", default: "SFKBP1109_s1200" }
permissions:
  contents: write
  issues: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "numpy<2" opencv-python-headless pandas scipy pytest pyyaml
      - name: tests (a failure stops everything below — no deploy, no run, no spend)
        run: python -m pytest -q tests
  run:
    needs: tests
    runs-on: ubuntu-latest
    environment: MODAL_TOKEN_ID
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal numpy
      - name: check the code compiles on the runner's Python (stops here before any spend)
        run: python -m py_compile modal_app.py scripts_scoreboard.py scripts_watch.py scripts_notify.py ipanema/*.py && python --version
      - name: deploy (always; costs nothing until something calls it)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py
      - name: run a match (only when the commit is tagged run) — watched, live log, automatic stop
        if: contains(github.event.head_commit.message, '[run') || github.event_name == 'workflow_dispatch'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
          MATCH: ${{ github.event.inputs.match_id || 'SFKBP1109_s1200' }}
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          M=$(python -c "import os,re; h=re.search(r'\[run:([A-Za-z0-9_-]+)\]', os.environ['MSG']); print(h.group(1) if h else os.environ['MATCH'])")
          python scripts_watch.py match "$M"
      - name: prepare a new match (commit tagged prepare:<match_id>)
        if: contains(github.event.head_commit.message, '[prepare:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, base64
          hit = re.search(r"\[prepare:([A-Za-z0-9_-]+)(?::(\d+))?\]", os.environ["MSG"]); mid = hit.group(1); start = int(hit.group(2) or 1200)
          out = modal.Function.from_name("ipanema", "prepare_match").remote(mid, f"{os.environ['R2_PUBLIC_URL']}/{mid}/video.mp4", start)
          mid = out.get("match_id", mid); d = f"results/prepare/{mid}"; os.makedirs(d, exist_ok=True)
          for name, b64 in out.items():
              if name.endswith(".jpg"): open(f"{d}/{name}", "wb").write(base64.b64decode(b64))
          open(f"{d}/segment.txt", "w").write(out.get("segment", ""))
          print("prepared", mid)
          PY
      - name: run a full match (commit tagged full:<match_id>) — watched, live log, automatic stop
        if: contains(github.event.head_commit.message, '[full:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          M=$(python -c "import os,re; print(re.search(r'\[full:([A-Za-z0-9_-]+)\]', os.environ['MSG']).group(1))")
          python scripts_watch.py full "$M"
      - name: export picker data (commit tagged export:<match_id>)
        if: contains(github.event.head_commit.message, '[export:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, base64, json
          mid = re.search(r"\[export:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "export_picker_data").remote(mid)
          os.makedirs("results/picker", exist_ok=True)
          if "npz" in out: open(f"results/picker/{mid}.npz", "wb").write(base64.b64decode(out.pop("npz")))
          open(f"results/picker/{mid}.json", "w").write(json.dumps(out)); print(out)
          PY
      - name: check one piece of a full match on CPU (commit tagged check:<match_id>)
        if: contains(github.event.head_commit.message, '[check:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, base64, json
          mid = re.search(r"\[check:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "check_piece").remote(mid)
          d = f"results/check/{mid}"; os.makedirs(d, exist_ok=True)
          for name, b64 in (out.pop("images", None) or {}).items(): open(f"{d}/{name}", "wb").write(base64.b64decode(b64))
          open(f"{d}/check.json", "w").write(json.dumps(out, indent=1, default=str)); print(json.dumps(out, indent=1, default=str)[:3000])
          PY
      - name: piece inventory (commit tagged inventory:<match_id>)
        if: contains(github.event.head_commit.message, '[inventory:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json
          mid = re.search(r"\[inventory:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "piece_inventory").remote(mid)
          os.makedirs("results/check", exist_ok=True); open(f"results/check/{mid}_inventory.json", "w").write(json.dumps(out, indent=1)); print(out)
          PY
      - name: collect a run's logs from the volume (commit tagged collect:<match_id>)
        if: contains(github.event.head_commit.message, '[collect:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          M=$(python -c "import os,re; print(re.search(r'\[collect:([A-Za-z0-9_-]+)\]', os.environ['MSG']).group(1))")
          python scripts_watch.py collect "$M"
      - name: calibration report per piece (commit tagged calreport:<match_id>)
        if: contains(github.event.head_commit.message, '[calreport:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[calreport:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "calib_report").remote(mid)
          d = f"results/check/{mid}_calib"; os.makedirs(d, exist_ok=True)
          for name, b64 in out["images"].items(): open(f"{d}/{name}", "wb").write(base64.b64decode(b64))
          open(f"{d}/report.json", "w").write(json.dumps(out["rows"], indent=1))
          print(json.dumps(out["rows"], indent=1)[:4000])
          PY
      - name: calibration snapping preview (commit tagged snappreview:<match_id>)
        if: contains(github.event.head_commit.message, '[snappreview:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[snappreview:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "snap_preview_match").remote(mid, [1, 5, 14, 15, 17, 18, 4], 106.0, 64.0)
          d = f"results/check/{mid}_snap"; os.makedirs(d, exist_ok=True); rows = []
          for r in out:
              if "jpg" in r: open(f"{d}/piece{r['i']:02d}_{r['kind']}_{r['k']:05d}.jpg", "wb").write(base64.b64decode(r.pop("jpg")))
              rows.append(r)
          open(f"{d}/snap.json", "w").write(json.dumps(rows, indent=1)); print(json.dumps(rows, indent=1)[:3000])
          PY
      - name: build the full-coverage panorama (commit tagged panorama:<match_id>)
        if: contains(github.event.head_commit.message, '[panorama:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[panorama:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "build_full_panorama").remote(mid)
          d = f"results/panorama/{mid}"; os.makedirs(d, exist_ok=True)
          open(f"{d}/panorama_full.jpg", "wb").write(base64.b64decode(out.pop("panorama_jpg")))
          open(f"{d}/panorama_full_drawn.jpg", "wb").write(base64.b64decode(out.pop("drawn_jpg")))
          open(f"{d}/panorama_full.json", "w").write(json.dumps(out, indent=1)); print("\n".join(out["log"]))
          PY
      - name: gate 2 - re-check the worst frames on the new map (commit tagged recheck:<match_id>)
        if: contains(github.event.head_commit.message, '[recheck:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[recheck:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          items = sorted({(r["i"], r["k"]) for r in json.load(open(f"results/check/{mid}_snap/snap.json")) if r.get("kind") == "worst"})
          out = modal.Function.from_name("ipanema", "recheck_frames").remote(mid, [list(x) for x in items])
          d = f"results/check/{mid}_recheck"; os.makedirs(d, exist_ok=True)
          for r in out:
              if "jpg" in r: open(f"{d}/piece{r['i']:02d}_{r['k']:05d}.jpg", "wb").write(base64.b64decode(r.pop("jpg")))
          open(f"{d}/recheck.json", "w").write(json.dumps(out, indent=1)); print(json.dumps(out, indent=1))
          PY
      - name: export clean frames for offline work (commit tagged frames:<match_id>)
        if: contains(github.event.head_commit.message, '[frames:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, base64
          mid = re.search(r"\[frames:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          items = sorted({(r["i"], r["k"]) for r in json.load(open(f"results/check/{mid}_snap/snap.json")) if "k" in r})
          out = modal.Function.from_name("ipanema", "export_frames").remote(mid, [list(x) for x in items])
          d = f"results/frames/{mid}"; os.makedirs(d, exist_ok=True); meta = []
          for r in out:
              open(f"{d}/piece{r['i']:02d}_{r['k']:05d}.jpg", "wb").write(base64.b64decode(r.pop("jpg"))); meta.append(r)
          open(f"{d}/frames.json", "w").write(json.dumps(meta)); print(len(meta), "frames exported")
          PY
      - name: export events (commit tagged events:<match_id>)
        if: contains(github.event.head_commit.message, '[events:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json
          mid = re.search(r"\[events:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "export_events").remote(mid, ["shot", "goal"])
          os.makedirs("results/check", exist_ok=True); open(f"results/check/{mid}_events.json", "w").write(json.dumps(out, indent=1)); print(len(out), "events")
          PY
      - name: detect match periods (commit tagged periods:<match_id>)
        if: contains(github.event.head_commit.message, '[periods:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json
          mid = re.search(r"\[periods:([A-Za-z0-9_-]+)\]", os.environ["MSG"]).group(1)
          out = modal.Function.from_name("ipanema", "detect_periods").remote(mid)
          os.makedirs("results/check", exist_ok=True); ps = out.pop("per_second", None)
          if ps: open(f"results/check/{mid}_per_second.json", "w").write(json.dumps(ps))
          open(f"results/check/{mid}_periods.json", "w").write(json.dumps(out, indent=1, default=str)); print(json.dumps(out, indent=1, default=str))
          PY
      - name: scoreboard
        if: always()
        run: |
          for f in $(git ls-files --others --modified results/modal | grep '\.txt$'); do m=$(basename "$f" .txt); python scripts_scoreboard.py "$f" "${{ github.sha }}" "$m" || true; done
      - name: commit results
        if: always()
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results && git commit -m "modal results" || echo "nothing to commit"
          git pull --rebase -X theirs origin main && git push origin HEAD:main
      - name: tell Daniel (opens an issue, which GitHub emails)
        if: always() && (contains(github.event.head_commit.message, '[run') || contains(github.event.head_commit.message, '[full:') || contains(github.event.head_commit.message, '[check:'))
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull -q origin main || true
          python scripts_notify.py && gh issue create --title "$(cat /tmp/issue_title)" --body-file /tmp/issue_body.md

name: run on modal
on:
  push:
    branches: [main]
    paths: ["ipanema/**", "modal_app.py", "calibration/**", "tests/**", "scripts_*.py", "periods/**", "triggers/**"]
  workflow_dispatch:
    inputs:
      match_id: { description: "match id", default: "SFKBP1109_s1200" }
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "numpy<2" opencv-python-headless pandas scipy pytest pyyaml supervision ultralytics torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: tests (a failure stops everything below — no deploy, no run, no spend)
        run: python -m pytest -q tests
      - name: model evals (scored on stored labelled data; a drop below a floor stops everything)
        run: python scripts_evals.py
  run:
    needs: tests
    runs-on: ubuntu-latest
    environment: MODAL_TOKEN_ID
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal numpy
      - name: check the code compiles on the runner's Python (stops here before any spend)
        run: python -m py_compile modal_app.py scripts_scoreboard.py scripts_watch.py scripts_notify.py ipanema/*.py && python --version
      - name: deploy (always; costs nothing until something calls it)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py
      - name: stop the Modal app (commit tagged stopapp) - halts every running job; the next push redeploys it
        if: contains(github.event.head_commit.message, '[stopapp]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal app stop ipanema --yes && echo "Modal app stopped"
      - name: new players in the RF-DETR image before a run (commit tagged [players-rf:<match>]) - GPU; stops the job if it fails
        if: contains(github.event.head_commit.message, '[players-rf:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, sys
          m = re.search(r"\[players-rf:([A-Za-z0-9_.-]+)\]", os.environ["MSG"]).group(1)
          f = modal.Function.from_name("ipanema", "players_rf"); out = {}
          out["smoke_300_frames"] = f.remote(m, 300); print(json.dumps(out["smoke_300_frames"], indent=1)[:3000], flush=True)
          if out["smoke_300_frames"].get("ok"):
              out["full"] = f.remote(m, 0); print(json.dumps(out["full"], indent=1)[:3000], flush=True)
          os.makedirs("results/ci", exist_ok=True); json.dump(out, open(f"results/ci/players_rf_{m}.json", "w"), indent=1)
          ok = out.get("full", {}).get("ok", False)
          open("/tmp/players_ok", "w").write("1" if ok else "0")
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ci && git commit -qm "players (RF-DETR) for the app run" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          test "$(cat /tmp/players_ok)" = "1"
      - name: new ball finder guesses in the RF-DETR image (commit tagged [ball-rf:<match>]) - GPU; stops the job if it fails
        if: contains(github.event.head_commit.message, '[ball-rf:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json, gzip
          m = re.search(r"\[ball-rf:([A-Za-z0-9_.-]+)\]", os.environ["MSG"]).group(1)
          f = modal.Function.from_name("ipanema", "ball_rf"); out = {}
          s = f.remote(m, 120); s.pop("rows", None); out["smoke_120_frames"] = s; print(json.dumps(s, indent=1)[:3000], flush=True)
          if s.get("ok"):
              full = f.remote(m, 0); rows = full.pop("rows", None); out["full"] = full; print(json.dumps(full, indent=1)[:3000], flush=True)
              if rows:
                  os.makedirs("results/picker", exist_ok=True)
                  json.dump(rows, gzip.open(f"results/picker/ball_cands_rfdetr_{m}.json.gz", "wt"))
          os.makedirs("results/ci", exist_ok=True); json.dump(out, open(f"results/ci/ball_rf_{m}.json", "w"), indent=1)
          open("/tmp/ball_ok", "w").write("1" if out.get("full", {}).get("ok") else "0")
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ci results/picker && git commit -qm "ball guesses (RF-DETR) for the app run" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          test "$(cat /tmp/ball_ok)" = "1"
      - name: run a match (only when the commit is tagged run) — watched, live log, automatic stop
        if: contains(github.event.head_commit.message, '[run') || github.event_name == 'workflow_dispatch'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MSG: ${{ github.event.head_commit.message }}
          MATCH: ${{ github.event.inputs.match_id || 'SFKBP1109_s1200' }}
        run: |
          git config user.name modal-bot && git config user.email modal@ipanema
          M=$(python -c "import os,re; h=re.search(r'\[run:([A-Za-z0-9_-]+)\]', os.environ['MSG']); print(h.group(1) if h else os.environ['MATCH'])")
          python scripts_watch.py match "$M"
      - name: profile tracking (commit tagged [profile]) - 400 frames, cents
        if: contains(github.event.head_commit.message, '[profile]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os
          out = modal.Function.from_name("ipanema", "profile_tracking").remote("SFKBP1109_s1200", 400)
          os.makedirs("results/modal", exist_ok=True); txt = "\n".join(out.get("log", [])) or str(out); open("results/modal/profile_tracking.txt", "w").write(txt + "\n"); print(txt)
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/modal/profile_tracking.txt && git commit -qm "profile tracking" && git push
      - name: auto-label test on the clip (commit tagged [autolabel]) - CPU, cents
        if: contains(github.event.head_commit.message, '[autolabel]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, base64
          out = modal.Function.from_name("ipanema", "ball_autolabel_test").remote("SFKBP1109_s1200")
          os.makedirs("results/autolabel", exist_ok=True)
          if "error" in out: open("results/autolabel/clip_report.json", "w").write(json.dumps(out)); print(out)
          else:
              json.dump(out["report"], open("results/autolabel/clip_report.json", "w"), indent=1); print(out["report"])
              if out.get("strip_b64"): open("results/autolabel/clip_strip.jpg", "wb").write(base64.b64decode(out["strip_b64"]))
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/autolabel && git commit -qm "autolabel clip test" && git push
      - name: auto-label the whole match from cached candidates (commit tagged [autolabel-match]) - CPU
        if: contains(github.event.head_commit.message, '[autolabel-match]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, base64
          out = modal.Function.from_name("ipanema", "ball_autolabel_match").remote("SFKBP1109")
          os.makedirs("results/autolabel", exist_ok=True)
          if "error" in out: open("results/autolabel/match_report.json", "w").write(json.dumps(out)); print(out)
          else:
              json.dump(out["report"], open("results/autolabel/match_report.json", "w"), indent=1); print(out["report"])
              if out.get("strip_b64"): open("results/autolabel/match_strip.jpg", "wb").write(base64.b64decode(out["strip_b64"]))
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/autolabel && git commit -qm "autolabel match" && git push
      - name: build the ball crop dataset on CPU (commit tagged [balldata:<n_auto>])
        if: contains(github.event.head_commit.message, '[balldata:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json
          h = re.search(r"\[balldata:(\d+)(?::st(\d+))?(?::x=([A-Za-z0-9_.,-]+))?\]", os.environ["MSG"]); n = int(h.group(1)); st = int(h.group(2) or 0); xs = h.group(3) or ""
          out = modal.Function.from_name("ipanema", "ball_dataset").remote("SFKBP1109", n, st, xs); print(json.dumps(out, indent=1))
          os.makedirs("results/ball", exist_ok=True); json.dump(out, open(f"results/ball/dataset_auto{n}_st{st}" + (f"_x{len(xs.split(','))}" if xs else "") + ".json", "w"), indent=1)
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ball && git commit -qm "ball dataset built" && git push
      - name: SoccerTrack from Kaggle (commit tagged [soccertrack] lists; [soccertrack:file1,file2] downloads) - CPU
        if: contains(github.event.head_commit.message, '[soccertrack')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, json
          m = re.search(r"\[soccertrack(?::([^\]]+))?\]", os.environ["MSG"]); files = [f.strip() for f in m.group(1).split(",")] if m.group(1) else []
          out = modal.Function.from_name("ipanema", "fetch_soccertrack").remote(os.environ["KAGGLE_API_TOKEN"], files)
          os.makedirs("results/soccertrack", exist_ok=True); json.dump(out, open("results/soccertrack/fetch.json", "w"), indent=1); print(out["listing"][-3000:]); print(out["gb"], "GB on volume")
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/soccertrack && git commit -qm "soccertrack fetch" && git push
      - name: SoccerTrack check pictures (commit tagged [stcheck]) - CPU, cents
        if: contains(github.event.head_commit.message, '[stcheck]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, base64
          out = modal.Function.from_name("ipanema", "soccertrack_check").remote(6)
          os.makedirs("results/soccertrack", exist_ok=True); b = out.pop("strip_b64", None)
          json.dump(out, open("results/soccertrack/check.json", "w"), indent=1); print(json.dumps(out, indent=1)[:3000])
          if b: open("results/soccertrack/check_strip.jpg", "wb").write(base64.b64decode(b))
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/soccertrack && git commit -qm "soccertrack check" && git push
      - name: restore the round-1 ball model as current (commit tagged [ballrestore])
        if: contains(github.event.head_commit.message, '[ballrestore]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -c "import modal; print(modal.Function.from_name('ipanema', 'ball_restore_v1').remote())"
      - name: fetch a file from the volume into results/volume (commit tagged [fetch:<relative path>])
        if: contains(github.event.head_commit.message, '[fetch:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, re, base64
          f = modal.Function.from_name("ipanema", "fetch_file")
          for rel in re.findall(r"\[fetch:([^\]]+)\]", os.environ["MSG"]):
              out = f.remote(rel, 0)
              if "error" in out: print(out); continue
              real = out["rel"]; dst = f"results/volume/{real}"; os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(dst, "wb") as fh:
                  fh.write(base64.b64decode(out["b64"]))
                  for part in range(1, out["parts"]): fh.write(base64.b64decode(f.remote(real, part)["b64"]))
              print(rel, out["bytes"], "bytes in", out["parts"], "parts")
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add -f results/volume && git commit -qm "fetched from the volume" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: WASB on the clip keeping 30 local peaks per frame, then copy the cache into the repo (commit tagged [wasb30]) - GPU about 5 min, approved by Daniel 28 Sep
        if: contains(github.event.head_commit.message, '[wasb30]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, base64
          out = modal.Function.from_name("ipanema", "wasb_regen").remote("SFKBP1109_s1200", 0.05, "local", 30); print(json.dumps(out, indent=1))
          f = modal.Function.from_name("ipanema", "fetch_file"); r = f.remote("cache/SFKBP1109_s1200/ball_cands_wasb_*_lp30.pkl", 0)
          if "error" in r: print(r); raise SystemExit(1)
          dst = f"results/volume/{r['rel']}"; os.makedirs(os.path.dirname(dst), exist_ok=True)
          with open(dst, "wb") as fh:
              fh.write(base64.b64decode(r["b64"]))
              for part in range(1, r["parts"]): fh.write(base64.b64decode(f.remote(r["rel"], part)["b64"]))
          print(dst, r["bytes"], "bytes")
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add -f results/volume && git commit -qm "WASB 30 peaks on the clip" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: ball-vs-not training crops (commit tagged [ballcrops]) - GPU, needs Daniel's go
        if: contains(github.event.head_commit.message, '[ballcrops]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, base64
          out = modal.Function.from_name("ipanema", "ball_crops").remote(); print(json.dumps(out, indent=1))
          if "error" in out: raise SystemExit(1)
          f = modal.Function.from_name("ipanema", "fetch_file"); r = f.remote(out["file"], 0)
          dst = f"results/volume/{r['rel']}"; os.makedirs(os.path.dirname(dst), exist_ok=True)
          with open(dst, "wb") as fh:
              fh.write(base64.b64decode(r["b64"]))
              for part in range(1, r["parts"]): fh.write(base64.b64decode(f.remote(r["rel"], part)["b64"]))
          os.makedirs("results/ball", exist_ok=True); json.dump(out, open("results/ball/crops.json", "w"), indent=1)
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add -f results/volume results/ball && git commit -qm "ball crops" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: pipeline smoke test after an image change (commit tagged [smoke]) - GPU a few minutes
        if: contains(github.event.head_commit.message, '[smoke]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json
          import traceback
          try: out = modal.Function.from_name("ipanema", "pipeline_smoke").remote()
          except Exception: out = {"all_ok": False, "remote_error": traceback.format_exc()[-6000:]}
          os.makedirs("results/ci", exist_ok=True); json.dump(out, open("results/ci/smoke.json", "w"), indent=1); print(json.dumps(out, indent=1)[:6000])
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ci/smoke.json && git commit -qm "pipeline smoke test" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: copy volume files to R2 for Kaggle (commit tagged [vol2r2]) - CPU only, approved by Daniel 29 Sep
        if: contains(github.event.head_commit.message, '[vol2r2]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json, traceback
          paths = [l.strip() for l in open("triggers/vol2r2.txt") if l.strip() and not l.startswith("#")]
          try: out = modal.Function.from_name("ipanema", "volume_to_r2").remote(paths)
          except Exception: out = {"error": traceback.format_exc()[-4000:]}
          os.makedirs("results/datasets", exist_ok=True); json.dump(out, open("results/datasets/modal_to_r2.json", "w"), indent=1); print(json.dumps(out, indent=1)[:5000])
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/datasets && git commit -qm "volume files copied to R2" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: ball probe below the cut-off (commit tagged [ballprobe]) - GPU, a few minutes, approved by Daniel 28 Sep
        if: contains(github.event.head_commit.message, '[ballprobe]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal, os, json
          out = modal.Function.from_name("ipanema", "ball_probe").remote()
          os.makedirs("results/ball", exist_ok=True); json.dump(out, open("results/ball/probe.json", "w"), indent=1)
          print(json.dumps({k: (v.get("summary", v) if isinstance(v, dict) else v) for k, v in out.items() if k != "log"}, indent=1)[:6000]); print("\n".join(out.get("log", [])))
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ball && git commit -qm "ball probe below the cut-off" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: ball ceiling on the exam frames (commit tagged [ballceiling] or [ballceiling:wasb]) - GPU, ~2 min
        if: contains(github.event.head_commit.message, '[ballceiling')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import modal, os, json
          if "[ballceiling:wasb]" in os.environ["MSG"]:
              out = modal.Function.from_name("ipanema", "wasb_ceiling").remote("SFKBP1109", 0.05); name = "ceiling_wasb.json"
          else:
              out = modal.Function.from_name("ipanema", "ball_ceiling").remote("SFKBP1109", 0.03, ""); name = "ceiling.json"
          os.makedirs("results/ball", exist_ok=True); json.dump(out, open(f"results/ball/{name}", "w"), indent=1); print(json.dumps(out.get("summary", out), indent=1))
          PY
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/ball && git commit -qm "ball ceiling" && git push
      - name: ball picker test on the clip from cached candidates (commit tagged [ballpick] / [ballpick:regen]) - CPU (+GPU for regen)
        if: contains(github.event.head_commit.message, '[ballpick')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: python scripts_ballpick.py
      - name: contact sheets of a clip, 1 picture/s (commit tagged [sheets:<clip>]) - CPU
        if: contains(github.event.head_commit.message, '[sheets:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python scripts_sheets.py
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/gt && git commit -qm "contact sheets" && git pull -q --rebase origin main && git push
      - name: copy the training matches from Drive to the volume (commit tagged [fetchdrive]) - CPU
        if: contains(github.event.head_commit.message, '[fetchdrive]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python scripts_fetch_drive.py
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/datasets && git commit -qm "drive fetch" && git pull -q --rebase origin main && git push
      - name: measure both ball finders on 10 min of a match (commit tagged [ballmeasure:<match>]) - GPU
        if: contains(github.event.head_commit.message, '[ballmeasure:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python scripts_ball_measure.py
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/datasets && git commit -qm "ball measure" && git pull -q --rebase origin main && git push
      - name: ball finders over whole training matches (commit tagged [ballmatch-test:<id>] / [ballmatch:<ids>] / [ballstatus])
        if: contains(github.event.head_commit.message, '[ballmatch') || contains(github.event.head_commit.message, '[ballstatus]')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python scripts_ballmatch.py
          git config user.name modal-bot && git config user.email modal@ipanema
          git add results/datasets && git commit -qm "ball match status" && git pull -q --rebase origin main && git push
      - name: tracking comparison on a GPU (commit tagged [tracktest-rf:<start_s>:<dur_s>])
        if: contains(github.event.head_commit.message, '[tracktest-rf:')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}

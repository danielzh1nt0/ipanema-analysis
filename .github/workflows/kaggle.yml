name: Kaggle job (free Kaggle GPU, no Modal)
on:
  push:
    branches: [main]
    paths: ["triggers/kaggle.txt"]
permissions:
  contents: write
jobs:
  kaggle:
    runs-on: ubuntu-latest
    environment: MODAL_TOKEN_ID
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q kaggle
      - name: run the Kaggle script named on the first line of triggers/kaggle.txt
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          mkdir -p results/kaggle
          python -c "import os,re; t=os.environ.get('KAGGLE_API_TOKEN',''); u=os.environ.get('KAGGLE_USERNAME',''); print('token length', len(t), '| old-style 32-hex key:', bool(re.fullmatch(r'[0-9a-f]{32}', t)), '| KGAT prefix:', t.startswith('KGAT'), '| username set:', bool(u))" | tee results/kaggle/diag.txt
          if python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[0-9a-f]{32}', os.environ.get('KAGGLE_API_TOKEN','')) else 1)"; then export KAGGLE_KEY="$KAGGLE_API_TOKEN"; unset KAGGLE_API_TOKEN; echo "using old-style key + username"; fi
          set -o pipefail; python tools/kaggle_run.py $(head -1 triggers/kaggle.txt) 2>&1 | tail -300 > results/kaggle/last_log.txt || echo "FAILED" >> results/kaggle/last_log.txt
          cat results/kaggle/last_log.txt
      - name: push an exported match into the app (needs the SUPABASE secrets; skipped without them)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.NEW_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY' 2>&1 | tee -a results/kaggle/last_log.txt
          import os, urllib.request
          k = os.environ.get("SUPABASE_SERVICE_KEY", ""); print("supabase key:", "set, %d chars" % len(k) if k else "NOT SET")
          if k:
              try:
                  r = urllib.request.Request("https://qnfjmzlwazqxhvveiovg.supabase.co/rest/v1/matches?select=id&limit=1", headers={"apikey": k, "Authorization": "Bearer " + k})
                  print("supabase rest check:", urllib.request.urlopen(r, timeout=20).status)
              except Exception as e: print("supabase rest check FAILED:", str(e)[:200])
          PY
          for lib in results/kaggle/*/export/library.json; do
            [ -f "$lib" ] || continue
            d="$(dirname "$lib")"; python tools/export_qa.py "$d" "" "$(dirname "$d")/qa.json" | tee -a results/kaggle/last_log.txt || echo "export QA failed" >> results/kaggle/last_log.txt
            for f in summary.json stats.json kit_A.png kit_B.png thumb.jpg; do cp "$d"/*/$f "$(dirname "$d")/$f" 2>/dev/null || true; done
            for f in "$d"/*/frames_lite.json; do [ -f "$f" ] && gzip -c "$f" > "$(dirname "$d")/frames_lite.json.gz"; done   # 3 frames/s whole match (~6 MB gz) for offline checks
            pip install -q supabase; set -o pipefail; python tools/app_push.py "$d" 2>&1 | tail -40 | tee -a results/kaggle/last_log.txt || echo "app push FAILED (see above)" | tee -a results/kaggle/last_log.txt
          done
      - name: commit
        if: always()
        run: |
          git config user.name "kaggle-bot" && git config user.email "bot@ipanema"
          git add results/kaggle; git commit -qm "kaggle job results" || echo "nothing"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin main && break; git rebase --abort 2>/dev/null; sleep 10; done
